<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">

        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>
            {% if page.title %}
            {{ page.title }} · {{ site.title }}
            {% else %}
            {{ site.title }}
            {% endif %}
        </title>

        <meta
            name="description"
            content="{{ page.description | default: site.description | escape }}"
            >

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown.css"
            >
    </head>

    <body>
        <main class="markdown-body">
            {{ content }}
        </main>
    </body>
</html>
